<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPS-TOPIK 농장 공부</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2E8B57">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--bg:#EEF4EF;--card:#fff;--ink:#16324F;--mute:#5d7184;--leaf:#2E8B57;--sun:#F2B134;--bad:#D1495B;--line:#d3dfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B17;--card:#18291F;--ink:#E8F1EA;--mute:#9bb2a3;--leaf:#4CC18A;--line:#294236}}
:root[data-theme="dark"]{--bg:#0F1B17;--card:#18291F;--ink:#E8F1EA;--mute:#9bb2a3;--leaf:#4CC18A;--line:#294236}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:17px;line-height:1.55}
#app{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1,h2,.kr{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
h1{font-size:30px;margin:8px 0 2px}h2{font-size:22px;margin:0 0 10px}
p.s{color:var(--mute);margin:0 0 16px;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;margin:10px 0;background:var(--leaf);color:#fff;font-size:18px;font-family:'Jua','Noto Sans KR',sans-serif;text-align:left}
.btn.alt{background:var(--sun);color:#2b2100}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);text-align:center}
.btn small{display:block;font-family:'Noto Sans KR';font-size:13px;opacity:.85}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:2px solid var(--line);border-radius:99px;padding:6px 14px;background:var(--card)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mute);font-size:15px}
.back{border:0;background:none;color:var(--mute);font-size:15px;padding:4px 0}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--leaf)}
.fc{background:var(--card);border:2px solid var(--line);border-radius:20px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;margin-bottom:14px;width:100%}
.fc .kr{font-size:46px;line-height:1.2}.fc .en{font-size:24px}.fc .hint{color:var(--mute);font-size:14px;margin-top:12px}
.row{display:flex;gap:10px}.row .btn{text-align:center}
.pass{background:var(--card);border-left:5px solid var(--sun);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:16px}
.q{font-size:20px;font-weight:700;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0;font-size:18px}
.opt.ok{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 20%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.paper{--card:#fff;--ink:#16324F;--line:#cfd8d2;--mute:#5d7184;background:#fff;color:#16324F;border:1px solid #dfe7e2;border-radius:18px;padding:16px}
.opt.sel{border-color:var(--ink);background:#E8F0FA}
.name{font-family:'Jua','Noto Sans KR',sans-serif;font-size:20px;text-align:center;margin:0 0 6px}
.tag{float:right;font-size:13px;font-weight:700}
.qimg{display:block;max-height:170px;max-width:100%;border-radius:10px;margin:0 0 12px;border:1px solid #dfe7e2}
.pimg{max-height:120px;max-width:47%;border-radius:8px;margin:0 6px 8px 0}
.pass summary{cursor:pointer;color:var(--mute);font-size:14px;margin-bottom:6px}.ch{margin-bottom:24px}.ch h2{margin-bottom:2px}
.big{font-family:'Jua';font-size:64px;line-height:1;margin:10px 0}
.wr{background:var(--card);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:16px}.wr b{color:var(--leaf)}

#bg{position:fixed;inset:0;z-index:-1;display:none;background:#123}.home #bg{display:block}
.sc{position:absolute;inset:0;opacity:0;transition:opacity 1.8s}.sc.on{opacity:1}.sc svg{position:absolute;inset:0;width:100%;height:100%}
.hero{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);min-height:210px;padding-top:6px}.hero h1{font-size:34px}.hero .name{color:#fff}
.cap{display:inline-block;background:rgba(0,0,0,.4);border-radius:12px;padding:6px 12px;font-size:14px;text-shadow:none;color:#fff;line-height:1.4}
.rk{display:flex;justify-content:space-between;align-items:center;width:100%;background:rgba(255,255,255,.93);color:#16324F;border:0;border-radius:14px;padding:12px 14px;font-family:'Jua','Noto Sans KR';font-size:19px;margin:6px 0 12px}.rk small{font-family:'Noto Sans KR';font-size:13px;color:#5d7184}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;background:rgba(255,255,255,.94);color:#16324F;border:0;border-radius:18px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile .ic{font-family:'Jua';font-size:36px;line-height:1.2}.tile b{font-family:'Jua';font-size:22px;font-weight:400}.tile small{color:#5d7184;font-size:13px}
.tile i{position:absolute;top:8px;right:10px;font-style:normal;font-size:13px;background:#fff3c4;border-radius:99px;padding:1px 8px}.tile.lock{grid-column:1/-1;opacity:.88}
#msg{color:#fff;text-shadow:0 1px 6px #000;font-size:14px;min-height:20px;margin-top:8px}
.rkc{text-align:center;background:var(--card);border-radius:18px;padding:14px;margin:10px 0}
@media(prefers-reduced-motion:reduce){.sc{transition:none}}
</style>
</head>

const D={"c45":{"t":"45과 · 농작물 재배","n":45,"p":{"notice":{"h":"<b>과수원 작업 안내</b><br>· 날짜 : 10월 15일 (목)<br>· 시간 : 오전 8시 ~ 오후 5시<br>· 작업 : 복숭아 수확<br>· 준비물 : 마스크, 장갑, 모자<br>※ 비가 오면 작업은 다음 날에 합니다.","i":[]},"dlg":{"h":"<b>반장님</b> : 주말에 비가 온다고 하니까 오늘은 복숭아부터 땁시다.<br><b>아지자</b> : 복숭아를 처음 따 보는데 어떻게 하면 돼요?<br><b>반장님</b> : 초록색 복숭아는 따지 말고 붉은 복숭아만 따면 돼요.<br><b>아지자</b> : 복숭아를 손으로 따요?<br><b>반장님</b> : 네, 익은 복숭아는 옆으로 살짝 돌리면 쉽게 딸 수 있어요. 복숭아에 털이 있으니까 장갑을 벗지 말고 꼭 끼고 따세요.","i":["peach"]},"smart":{"h":"<b>스마트팜</b><br>스마트팜은 농업에 ICT 기술을 접목한 농업 시스템입니다. 센서와 컴퓨터로 농작물의 성장 환경을 관리합니다. 그래서 수확량과 품질이 좋아지고 일하는 사람의 힘든 일을 줄일 수 있습니다. 딸기, 상추 같은 채소와 과일을 키울 수 있습니다.","i":["strawberry","robot"]},"full":{"h":"<b>스마트팜</b><br>스마트팜은 농업에 정보통신기술(ICT)을 접목하여 농작물을 효율적으로 관리하는 농업 시스템입니다. 스마트팜은 농작물의 생산성을 향상시키고 노동력을 절감하게 해 주며 친환경 농업을 실현하는 데 도움을 줍니다. 스마트팜은 딸기, 수박 등의 과일류부터 상추, 청경채 등의 채소류와 바질, 로즈마리 등의 허브류에 이르기까지 다양한 농작물을 재배하는 데 활용되고 있으며 미래 농업의 중요한 요소로 더욱 주목받고 있습니다.<br><br>스마트팜은 농작물의 성장 환경을 관리하기 위하여 센서와 네트워크 기술을 활용하고, 성장 조건을 최적화하기 위하여 빅데이터와 인공지능 기술을 활용합니다. 이와 같은 스마트팜 기술은 농작물의 수확량과 품질을 향상시키고 자원을 효율적으로 관리할 수 있도록 해 줍니다.<br><br>한국은 스마트팜 분야에서 빠르게 성장하고 있는 국가 중 하나입니다. 한국 정부는 스마트팜을 미래 농업의 핵심 분야로 인식하고, 다양한 정책으로 스마트팜의 보급과 발전을 지원하고 있습니다. 그 결과 스마트팜 기술이 빠르게 보급되고 있으며, 스마트팜 농업의 시장 규모도 2021년 이후 연평균 약 15% 정도의 성장률을 보일 정도로 크게 확대되었습니다.","i":[]}},"q":[{"n":1,"q":"이것은 무엇입니까?","c":"감자","w":["고추","무","오이"],"i":"gamja"},{"n":2,"q":"이것은 무엇입니까?","c":"고추","w":["고구마","호박","배추"],"i":"chili"},{"n":3,"q":"남자가 배추를 ( ).","c":"뽑고 있어요","w":["따고 있어요","캐고 있어요","뿌리고 있어요"],"i":"q1"},{"n":4,"q":"남자가 거름을 ( ).","c":"주고 있어요","w":["캐고 있어요","따고 있어요","파고 있어요"],"i":"q2"},{"n":5,"q":"남자가 땅을 ( ).","c":"파고 있어요","w":["따고 있어요","뽑고 있어요","담고 있어요"],"i":"q3"},{"n":6,"q":"이 사람이 쓰는 도구는 무엇입니까?","c":"곡괭이","w":["사다리","호미","예초기"],"i":"pickaxe"},{"n":7,"q":"이것은 무엇입니까?","c":"경운기","w":["트럭","비닐하우스","삽"],"i":"tiller"},{"n":8,"q":"남자는 지금 무엇을 하고 있습니까?","c":"농약을 뿌리고 있어요","w":["수확하고 있어요","상자에 담고 있어요","트럭에 싣고 있어요"],"i":"spray"},{"n":9,"q":"이 사람은 지금 무엇을 하고 있습니까?","c":"잡초를 제거하고 있어요","w":["물을 대고 있어요 , 돼지고기 등 여러 가지 육류를 먹습니다. 그중에서도 돼지고기를 가장 많이 먹는데, 삼겹살은 한국을 대표하는 음식 중 하나입니다.<br><br>그다음으로 소비량이 많은 것은 닭고기와 소고기입니다. 닭고기는 삼계탕, 찜닭, 닭갈비, 프라이드치킨 등 여러 요리에 쓰입니다. 특히 한국의 프라이드치킨은 세계적으로 인기가 있습니다. 대구에서는 매년 여름 치킨과 맥주를 함께 즐기는 ‘치맥 페스티벌’이 열립니다. 소고기는 가장 고급 식재료로 여겨지고, 한국에서 나고 자란 소를 ‘한우’라고 합니다.<br><br>이렇게 한국에서는 육류를 많이 먹지만, 최근에는 건강과 환경 문제에 관심이 늘면서 채식주의자나 육류 소비를 줄이는 사람이 많아지고 있습니다. 그래서 식물성 고기나 비건 제품을 찾는 사람도 늘고 있습니다.","i":[]},"dlg2":{"h":"<b>사장님</b> : 프엉 씨, 오후에는 축사 청소를 해야 돼요.<br><b>프엉</b> : 그럼 지금 소들을 다른 우방으로 이동시킬까요?<br><b>사장님</b> : 혼자 하기 힘드니까 다라 씨랑 같이 하세요. 나는 트랙터로 톱밥 좀 가져올게요. 참, 소독도 해야 되는데……<br><b>프엉</b> : 소독이요? 지난주에 소독을 했는데요.<br><b>사장님</b> : 일주일에 한 번씩 소독해야 소들이 병에 걸리지 않아요. 다라 씨한테 청소 도구 좀 가져오게 하고, 프엉 씨는 소독할 준비를 좀 해 주세요. 다라 씨는 소독을 해 본 적이 없거든요.","i":["disinfect"]}},"q":[{"n":1,"q":"이것은 무엇입니까?","c":"소","w":["말","양","돼지"],"i":"so"},{"n":2,"q":"이것은 무엇입니까?","c":"돼지","w":["토끼","양","오리"],"i":"dwaeji"},{"n":3,"q":"이것은 무엇입니까?","c":"닭","w":["오리","말","양"],"i":"dak"},{"n":4,"q":"이것은 무엇입니까?","c":"오리","w":["닭","토끼","양"],"i":"oori"},{"n":5,"q":"이것은 무엇입니까?","c":"토끼","w":["양","돼지","오리"],"i":"tokki"},{"n":6,"q":"이것은 무엇입니까?","c":"말","w":["소","양","토끼"],"i":"mal"},{"n":7,"q":"이것은 무엇입니까?","c":"바가지","w":["급수기","짚","사료조"],"i":"bagaji"},{"n":8,"q":"이것은 무엇입니까?","c":"짚","w":["분뇨","바가지","톱밥"],"i":"jip"},{"n":9,"q":"이것은 무엇입니까?","c":"건초","w":["분뇨","트랙터","바가지"],"i":"hay"},{"n":10,"q":"이것은 무엇입니까?","c":"트랙터","w":["경운기","트럭","분뇨 탱크"],"i":"tractor"},{"n":11,"q":"남자는 지금 무엇을 하고 있습니까?","c":"소독을 하고 있어요","w":["사료를 주고 있어요","분뇨를 치우고 있어요","소를 이동시키고 있어요"],"i":"disinfect"},{"n":12,"q":"사람이 소에게 무엇을 하고 있습니까?","c":"조사료를 주고 있어요","w":["소독약을 뿌리고 있어요","분뇨를 치우고 있어요","물청소를 하고 있어요"],"i":"feeding"},{"n":13,"q":"그림에서 빨간 동그라미는 무엇입니까?","c":"분뇨","w":["건초","사료","톱밥"],"i":"bunnyo"},{"n":14,"q":"여기는 어디입니까?","c":"양계장","w":["소 축사","돼지 농장","분뇨 탱크"],"i":"chickfarm"},{"n":15,"q":"가 : 소를 키워 본 적이 있어요?<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;나 : 아니요, ( ).","c":"키워 본 적이 없어요","w":["키우게 했어요","키울까 해요","키워서 와요"]},{"n":16,"q":"저는 한국에 와서 삼겹살을 ( ).","c":"먹은 적이 있어요","w":["먹을 적이   ${nx?`<div class="bar"><i style="width:${(x-r[0])/(nx[0]-r[0])*100}%"></i></div><p class="s">${nx[0]-x} more points to ${nx[1]} ${nx[2]}</p>`:'<p class="s">Top rank! 🎉</p>'}</div>
  <h2>Papers</h2>${Object.keys(D).map(k=>{const b=bestOf(k);return `<div class="wr">${D[k].n}과 ${nm(k)}<br><b>${b!==null?b+'/100':'—'}</b> · ${hist().filter(x=>x.k===k&&!x.x).length} tries</div>`}).join('')}
  <h2 style="margin-top:16px">Recent</h2>${h.length?h.map(e=>`<div class="wr">${new Date(e.t).toLocaleDateString()} · ${D[e.k].n}과 ${e.x?'Extra':'Paper'} · <b>${e.p}${e.x?'%':'점'}</b></div>`).join(''):'<p class="s">No papers yet.</p>'}
  <button class="btn ghost" onclick="home()">Home</button>`;
}
/* ---- flashcards ---- */
let deck=[],flip=false,total=0,fk='';
function cards(k){hm(false);fk=k;deck=sh(V.filter(v=>v[2]===D[k].n));total=deck.length;flip=false;card()}
function card(){
  if(!deck.length){app.innerHTML=`<div style="text-align:center;padding-top:40px"><div class="big">🎉</div><h2>다 외웠어요!</h2><p class="s">You went through all ${total} cards.</p><button class="btn ghost" onclick="lesson(fk)">Back</button></div>`;return}
  const c=deck[0];
  app.innerHTML=`${NM()}<div class="top"><button class="back" onclick="lesson(fk)">← Back</button><span>${total-deck.length}/${total}</span></div>
  <div class="bar"><i style="width:${(total-deck.length)/total*100}%"></i></div>
  <button class="fc" onclick="flip=!flip;card()">${flip?`<div class="en">${c[1]}</div><div class="hint">${c[0]}</div>`:`<div class="kr">${c[0]}</div><div class="hint">Tap to see meaning</div>`}</button>
  <div class="row"><button class="btn ghost" onclick="deck.push(deck.shift());flip=false;card()">다시<small>Again</small></button><button class="btn" onclick="deck.shift();flip=false;card()">알아요<small>I know it</small></button></div>`;
}
/* ---- paper ---- */
let snd=ld('snd',true),ac=null;
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(f,d,v){if(!snd||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function tk(){if(left<=10)beep(1400,.14,.22);else if(left<=60)beep(1000,.06,.1);else beep(800,.04,.04)}
function tg(){snd=!snd;sv('snd',snd);unlock();document.querySelectorAll('.sb').forEach(b=>b.textContent=snd?'🔊':'🔇')}
let qs=[],qi=0,left=0,ck='',ex=0,saved=false;
function quiz(k,x){hm(false);ck=k;ex=x;saved=false;qs=D[k].q.filter(q=>x?q.n>25:q.n<=25).map(q=>({...q,o:sh([q.c,...q.w]),a:-1}));qi=0;left=Math.round(qs.length*84);clearInterval(tm);unlock();tm=setInterval(()=>{left--;const t=$('#t');if(t)t.textContent=fmt(left);if(left<=0)finish();else tk()},1000);ask()}
function head(r){const q=qs[qi],p=q.p?D[ck].p[q.p]:null,im=D[ck].im;
  return `<div class="paper">${NM()}<div class="top"><button class="back" onclick="lesson(ck)">← Back</button><span>${D[ck].n}과 · ${q.n}번 · ${qi+1}/${qs.length}${r?' · Review':` · ⏱ <b id="t">${fmt(left)}</b> <button class="back sb" onclick="tg()">${snd?'🔊':'🔇'}</button>`}</span></div><div class="bar"><i style="width:${(qi+1)/qs.length*100}%"></i></div>
  ${p?`<details open class="pass"><summary>📖 글 · Passage</summary>${p.i.map(i=>`<img class="pimg" src="${im[i]}">`).join('')}<div>${p.h}</div></details>`:''}
  ${q.i?`<img class="qimg" src="${im[q.i]}">`:''}<p class="q">${q.q}</p>`}
function ask(){
  const q=qs[qi],last=qi===qs.length-1;
  app.innerHTML=head(false)+q.o.map((o,i)=>`<button class="opt ${q.a===i?'sel':''}" onclick="pick(${i})">${'①②③④'[i]}&nbsp; ${o}</button>`).join('')+
  `<div class="row" style="margin-top:8px">${qi?`<button class="btn ghost" onclick="qi--;ask()">← 이전</button>`:''}<button class="btn" style="text-align:center" onclick="${last?'finish()':'qi++;ask()'}">${last?'제출 · Submit':'다음 · Next'}</button></div></div>`;
  scrollTo(0,0);
}
function pick(i){qs[qi].a=i;document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j===i))}
function finish(){
  clearInterval(tm);const sc=qs.filter(q=>q.o[q.a]===q.c).length,pts=Math.round(sc/qs.length*100);let up='';
  if(!saved){saved=true;const r0=rank(),h=hist();h.push({k:ck,x:ex,p:pts,t:Date.now()});sv('hist',h.slice(-300));const r1=rank();if(r1>r0)up=`<div class="rkc"><div class="big">${RK[r1][1]}</div><h2>🎉 New rank: ${RK[r1][2]} · ${RK[r1][3]}</h2></div>`}
  app.innerHTML=`${NM()}<div style="text-align:center"><div class="big">${pts>=80?'🌟':'🌱'}</div><h2>${sc} / ${qs.length}${ex?'':' · '+pts+'점'}</h2><p class="s">${ex?'Practice done!':pts>=80?'Pass level (80+)!':'Keep going: the pass mark is 80.'}${qs.some(q=>q.a<0)?' Unanswered questions count as wrong.':''}</p></div>${up}
  <button class="btn alt" onclick="qi=0;review()">답 확인 · Check answers from the start</button><button class="btn" onclick="quiz(ck,ex)">Try again</button><button class="btn ghost" onclick="lesson(ck)">Back to lesson</button><button class="btn ghost" onclick="board()">🏅 My ranks</button>`;
}
function review(){
  const q=qs[qi],last=qi===qs.length-1,right=q.o[q.a]===q.c;
  app.innerHTML=head(true)+`<p style="font-weight:700;color:${right?'#2E8B57':'#D1495B'};margin:0 0 6px">${right?'✔ 맞았어요 · Correct':q.a<0?'✘ No answer':'✘ 틀렸어요 · Wrong'}</p>`+
  q.o.map((o,i)=>`<div class="opt ${o===q.c?'ok':i===q.a?'no':''}">${'①②③④'[i]}&nbsp; ${o}<span class="tag">${o===q.c?'✔ answer':i===q.a?'your answer':''}</span></div>`).join('')+
  `<div class="row" style="margin-top:8px">${qi?`<button class="btn ghost" onclick="qi--;review()">← 이전</button>`:''}<button class="btn" style="text-align:center" onclick="${last?'finish()':'qi++;review()'}">${last?'결과 · Result':'다음 · Next'}</button></div></div>`;
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
